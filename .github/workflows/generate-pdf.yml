name: Generate PDF from Report

on:
  repository_dispatch:
    types: [build-pdf]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Install Chinese fonts and Times New Roman
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-microhei fonts-wqy-zenhei
          sudo apt-get install -y ttf-mscorefonts-installer fonts-liberation
          # 手动注册 Times New Roman 字体
          sudo fc-cache -fv
          # 验证安装
          fc-list | grep -i "times" || echo "Times New Roman not found"

      - name: Generate PDF and save to PDF/ folder
        env:
          STUDENT_ID: ${{ github.event.client_payload.student_id }}
          REPORT_TEXT: ${{ github.event.client_payload.output }}
        run: |
          python generate_pdf.py "$STUDENT_ID" "$REPORT_TEXT"

      - name: Commit and push PDF file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add PDF/*.pdf
          git commit -m "Add PDF for student $STUDENT_ID [skip ci]" || echo "No changes to commit"
          git push
