name: Generate PDF from Report

on:
  repository_dispatch:
    types: [build-pdf]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright jinja2 requests
          playwright install chromium

      - name: Generate PDF and upload to tmpfiles.org
        env:
          STUDENT_ID: ${{ github.event.client_payload.student_id }}
          REPORT_TEXT: ${{ github.event.client_payload.output }}
        run: |
          python generate_pdf.py "$STUDENT_ID" "$REPORT_TEXT"

      - name: Save download URL to file
        run: |
          echo "PDF_URL=$(cat pdf_url.txt)" >> $GITHUB_ENV

      - name: Commit URL to repo (or update Gist)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "$PDF_URL" > latest_pdf_url.txt
          git add latest_pdf_url.txt
          git commit -m "Update latest PDF URL [skip ci]" || true
          git push
