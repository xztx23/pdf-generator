name: 生成论文审查PDF
on:
  workflow_dispatch:   # 允许手动运行
  repository_dispatch:
    types: [generate_pdf]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装环境
        run: |
          sudo apt update
          sudo apt install -y fonts-wqy-zenhei python3-pip
          pip install reportlab

      - name: 保存传入内容
        run: |
          echo '${{ github.event.client_payload.content }}' > content.txt
          echo '${{ github.event.client_payload.student_id }}' > student_id.txt

      - name: 生成PDF
        run: python3 build_pdf.py

      - name: 上传PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.student_id }}
          path: ${{ github.event.client_payload.student_id }}.pdf
